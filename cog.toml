branch_whitelist = ["main"]
ignore_merge_commits = true
tag_prefix = "v"

pre_bump_hooks = [
]

post_bump_hooks = [
]

pre_package_bump_hooks = [
]

[packages.gill-app]
path = "crates/gill-app"
public_api = true
bump_order = 1

[packages.gill-authorize-derive]
path = "crates/gill-authorize-derive"
public_api = false
bump_order = 1

[packages.gill-db]
path = "crates/gill-db"
public_api = false
bump_order = 1

[packages.gill-git]
path = "crates/gill-git"
public_api = false
bump_order = 1

[packages.gill-git-server]
path = "crates/gill-git-server"
public_api = true
bump_order = 1

[packages.gill-markdown]
path = "crates/gill-markdown"
public_api = false
bump_order = 1

[packages.gill-settings]
path = "crates/gill-settings"
public_api = true
bump_order = 1

[packages.gill-syntax]
path = "crates/gill-syntax"
public_api = true
bump_order = 1

[packages.gill-web-markdown]
path = "crates/gill-web-markdown"
public_api = true
bump_order = 1

[packages.syntect-plugin]
path = "crates/syntect-plugin"
public_api = false
bump_order = 1

[changelog]
template = "monorepo_remote"
package_template = "package_remote"
remote = "github.com"
repository = "gill"
owner = "oknozor"
authors = [
    { signature = "Paul Delafosse", username = "oknozor" },
]
